name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Bun version from Dockerfile
        id: bun
        run: |
          echo "version=$(grep -m1 -oE 'oven/bun:[0-9.]+' Dockerfile | cut -d: -f2)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Bun version from Dockerfile
        id: bun
        run: |
          echo "version=$(grep -m1 -oE 'oven/bun:[0-9.]+' Dockerfile | cut -d: -f2)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    env:
      # compose.yaml requires DOMAIN; Caddy is not started here
      DOMAIN: localhost
      DRECK_SECRET: ci-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      # compose.yaml pulls the published image; build it locally under that name instead
      - run: docker build -t ghcr.io/julianhandl/dreck:latest .
      - run: docker compose up -d app
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T app wget -qO- http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker compose logs app
          exit 1
      - if: always()
        run: docker compose down -v

  publish:
    if: github.event_name == 'push'
    needs: [check, e2e, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
