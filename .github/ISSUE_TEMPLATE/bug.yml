name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` in your checkout, or the version from the log
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Firefox 140 on macOS, Safari on iOS 19
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: "`docker compose logs app`; remove the secret if it appears"
      render: text
